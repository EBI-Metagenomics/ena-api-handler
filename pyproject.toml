[project]
name = "ena-api-handler"
version = "3.0.0"
description = "ENA API client"
authors = [
    { name = "Aleksandar", email = "arjkvc@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires network access to the ENA API",
]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
mypy_path = "scripts"
exclude = ["^ena_portal_api/"]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
